name: Aggiorna card statistiche

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/card.mjs, .github/workflows/card.yml]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Genera SVG
        run: node scripts/card.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add card-light.svg card-dark.svg
          git diff --cached --quiet || git commit -m "Aggiorna card statistiche"
          git push
